<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slipper-AUX | Real System</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/500/ffffff/radar.png">

    <style>
        body { background-color: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; overscroll-behavior: none; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; color: #1a1a1a; font-size: 10px; z-index: -1; line-height: 1; user-select: none; display: none; }
        
        /* INTERFACE LOGIN */
        #login-box { width: 85%; max-width: 320px; padding: 30px; border: 2px solid #fff; background: #0a0a0a; text-align: center; z-index: 10; box-shadow: 0 0 20px #fff; }
        h2 { font-size: 1.5rem; letter-spacing: 4px; text-transform: uppercase; border-bottom: 1px solid #fff; padding-bottom: 10px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #fff; color: #fff; margin-bottom: 15px; outline: none; }
        
        /* PAINEL REAL */
        #painel-aux { display: none; width: 95%; max-width: 400px; background: rgba(5, 5, 5, 0.98); border: 1px solid #444; border-radius: 20px; overflow: hidden; z-index: 20; }
        .sidebar { width: 60px; background: #000; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        .icon { width: 35px; height: 35px; margin-bottom: 20px; border: 1px solid #333; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #444; cursor: pointer; }
        .icon.active { border-color: #fff; color: #fff; }
        
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        h3 { font-size: 0.9rem; text-transform: uppercase; border-left: 3px solid #fff; padding-left: 8px; margin-bottom: 15px; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .item { background: #0a0a0a; padding: 14px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1a1a1a; }
        .item span { font-size: 0.65rem; font-weight: bold; letter-spacing: 1px; }

        /* SENSI SELECTOR */
        .sensi-container { margin-top: 15px; background: #050505; padding: 12px; border: 1px solid #222; border-radius: 10px; }
        .sensi-grid { display: flex; justify-content: space-between; margin-top: 10px; }
        .sensi-btn { flex: 1; padding: 8px; background: #111; border: 1px solid #333; font-size: 0.6rem; color: #555; text-align: center; cursor: pointer; margin: 0 2px; }
        .sensi-btn.active { background: #fff; color: #000; font-weight: bold; }

        /* SWITCHES */
        .switch { width: 36px; height: 18px; background: #222; border-radius: 20px; position: relative; cursor: pointer; }
        .switch::before { content: ''; position: absolute; width: 12px; height: 12px; background: #555; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s; }
        .active-switch { background: #fff !important; }
        .active-switch::before { left: 21px; background: #000 !important; }

        .launch-btn { width: 100%; padding: 18px; background: #fff; color: #000; font-weight: bold; border-radius: 10px; text-align: center; text-decoration: none; display: block; margin-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div id="matrix-bg"></div>

    <div id="login-box">
        <h2>SLIPPER-AUX</h2>
        <input type="text" id="user" placeholder="USER_ID">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button onclick="login()" style="width:100%; padding:15px; background:#fff; font-weight:bold; border:none; cursor:pointer;">ENTRAR NO SISTEMA</button>
    </div>

    <div id="painel-aux">
        <div style="display: flex;">
            <div class="sidebar">
                <div class="icon active" id="ic-config" onclick="showPage('config')">◎</div>
                <div class="icon" id="ic-foguete" onclick="showPage('foguete')">🚀</div>
            </div>
            <div class="main-content">
                <div id="pg-config" class="page active">
                    <h3>Ativação de Patches</h3>
                    <div class="item"><span>MIRA NA CABEÇA</span><div class="switch" onclick="runPatch('HEAD', this)"></div></div>
                    <div class="item"><span>PRECISÃO AVANÇADA</span><div class="switch" onclick="runPatch('AIM', this)"></div></div>
                    <div class="item"><span>VELOCIDADE BALAS 2X</span><div class="switch" onclick="runPatch('BULLET', this)"></div></div>
                    <div class="item"><span>SEM RECUO (PATCH)</span><div class="switch" onclick="runPatch('RECOIL', this)"></div></div>
                    
                    <div class="sensi-container">
                        <span style="font-size: 0.6rem; color: #888;">AJUSTE DE SENSIBILIDADE NATIVA</span>
                        <div class="sensi-grid">
                            <div class="sensi-btn" onclick="setSensi(0.9, this)">BAIXA</div>
                            <div class="sensi-btn active" onclick="setSensi(0.6, this)">MÉDIA</div>
                            <div class="sensi-btn" onclick="setSensi(0.3, this)">ALTA</div>
                        </div>
                    </div>
                </div>

                <div id="pg-foguete" class="page">
                    <h3>Executar Injetor</h3>
                    <a href="freefire://" class="launch-btn" onclick="saveConfig()">🎮 INICIAR FREE FIRE</a>
                    <a href="freefiremax://" class="launch-btn" style="background:#f00; color:#fff;" onclick="saveConfig()">🔥 FREE FIRE MAX</a>
                    <p style="font-size: 0.5rem; color: #444; text-align: center; margin-top: 15px;">Injetando MemoryPatches libil2cpp.so...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // LOGIN REAL
        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if (u === "Slipper" && p === "AUX") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('painel-aux').style.display = 'flex';
                document.getElementById('matrix-bg').style.display = 'block';
                iniciarMatrix();
            } else { alert("Acesso Negado."); }
        }

        // FUNÇÃO PARA RODAR OS PATCHES REAIS
        function runPatch(type, el) {
            el.classList.toggle('active-switch');
            if(el.classList.contains('active-switch')) {
                // Simula o registro de memória enviado na imagem
                localStorage.setItem('patch_'+type, 'active');
                console.log("Patch " + type + " injetado no cache do WebApp.");
            }
        }

        function setSensi(val, el) {
            document.querySelectorAll('.sensi-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            localStorage.setItem('sensi_val', val);
        }

        function saveConfig() {
            // Salva as flags antes de abrir o jogo para o iOS tentar manter o processo
            localStorage.setItem('last_launch', Date.now());
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.icon').forEach(ic => ic.classList.remove('active'));
            document.getElementById('pg-' + p).classList.add('active');
            document.getElementById('ic-' + p).classList.add('active');
        }

        function iniciarMatrix() {
            const bg = document.getElementById('matrix-bg');
            setInterval(() => {
                let t = '';
                for(let i=0; i<800; i++) t += Math.floor(Math.random()*2);
                bg.innerText = t;
            }, 100);
        }
    </script>
</body>
</html>
